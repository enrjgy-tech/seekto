<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Record your class: deadlines go on your calendar and the lesson becomes a practice test you can share. Also for meetings. Private, no account, works without AI. Free and open source.">
<meta name="theme-color" content="#0a0a0b">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com; media-src 'self' blob:; font-src 'self'; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Seekto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <a class="skip" href="#main" data-i18n>Skip to content</a>
  <nav class="side" aria-label="Main" data-i18n-label="Main">
    <div class="brand"><img src="icon.svg" alt="">Seekto <small data-i18n>preview</small></div>
    <button class="nav rec" data-go="record" data-i18n><span class="dot"></span>Record a class</button>
    <button class="nav" data-go="chat" data-i18n><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4z"/></svg>Assistant</button>
    <button class="nav" data-go="notes" data-i18n><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>Notes</button>
    <button class="nav" data-go="calendar" data-i18n><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</button>
    <div class="grow"></div>
    <button class="nav" id="connectBtn" data-i18n><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="12" height="9" rx="1.5"/><rect x="15" y="9" width="6" height="11" rx="1.5"/><path d="M6 17h6"/></svg>Connect a device</button>
    <button class="nav" data-go="settings" data-i18n><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Settings</button>
    <div class="model-pill" id="devicePill"></div>
    <div class="model-pill" id="modelPill"></div>
  </nav>
  <main id="main" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Main, phone" data-i18n-label="Main, phone">
    <button class="tab" data-go="chat" data-i18n><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4z"/></svg>Assistant</button>
    <button class="tab" data-go="notes" data-i18n><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>Notes</button>
    <button class="tab rec" data-go="record" data-i18n><span class="ring"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg></span>Record</button>
    <button class="tab" data-go="calendar" data-i18n><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</button>
    <button class="tab" data-go="settings" data-i18n><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div id="overlay"></div>
<div id="sr" class="sr-only" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
