name: Definition model check

# Manual only. Asks a small language model whether each judged definition candidate really is a
# definition, and reports how well that separates real ones from false ones. The model runs on
# the runner (the same kind of in-browser model Seekto already uses for speech). See engine/bench/README.md.
on:
  workflow_dispatch:
    inputs:
      models:
        description: Hugging Face model ids, separated by spaces
        default: Xenova/flan-t5-small Xenova/flan-t5-base

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          MODELS: ${{ inputs.models }}
        run: echo "matrix=$(printf '%s\n' $MODELS | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  evaluate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @huggingface/transformers@3.0.2
      - name: Score every candidate
        run: node test/def-model-eval.mjs "${{ matrix.model }}" > out.log 2>&1 || true
      - name: Report
        run: |
          tail -c 1500 out.log | tr '\n' ' ' | sed 's/^/::notice title=log::/'
          grep '^RESULT' out.log | while read -r line; do echo "::notice title=${{ matrix.model }}::$line"; done
          [ -f scores.json ] && gzip -9 -c scores.json | base64 -w0 | fold -w 3500 | awk '{print "::notice title=scores-" NR "::" $0}' || true
