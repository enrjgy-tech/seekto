name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Every interface string is translated
        run: node pipeline/i18n.mjs
      - name: Accuracy on held-out sentences
        run: node engine/bench/run.mjs --check
      - run: npm run check:packs
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - name: Copy the speech library into the site
        run: npm run vendor
      - name: Install a headless browser
        run: npm i --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: First screen, practice test, shared link on a phone, paste, Spanish
        run: node test/smoke.mjs
      - name: Private transcription loads from the site alone and runs Whisper
        run: |
          sudo apt-get install -y -qq espeak-ng mbrola mbrola-us1 > /dev/null || sudo apt-get install -y -qq espeak-ng > /dev/null
          espeak-ng -v mb-us1 -s 130 -w /tmp/speech.wav "Your chemistry test is on Friday." || espeak-ng -v en-us -s 130 -w /tmp/speech.wav "Your chemistry test is on Friday."
          SPEECH_WAV=/tmp/speech.wav node test/whisper.mjs

  storage-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase-like roles
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin; grant usage on schema public to anon, authenticated; alter default privileges in schema public grant all on tables to anon, authenticated; alter default privileges in schema public grant all on sequences to anon, authenticated;"
      - name: Setup script runs, twice
        run: psql -v ON_ERROR_STOP=1 -f app/supabase.sql && psql -v ON_ERROR_STOP=1 -f app/supabase.sql
      - name: Storage checks
        run: psql -v ON_ERROR_STOP=1 -f engine/test/sql/storage.test.sql

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and serve the self-hosting image
        run: |
          docker build -t seekto .
          docker run -d -p 8080:80 --name seekto seekto
          sleep 2
          curl -fsS http://localhost:8080/ | grep -q "<title>Seekto</title>"
          curl -fsS http://localhost:8080/sw.js > /dev/null
