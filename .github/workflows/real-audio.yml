name: Real audio

# Manual only. Takes a real, openly licensed lecture recording (by default MIT 14.01 lecture 1), runs it through Whisper and the
# engine exactly as the app does, and saves the transcript and what the engine found as a build
# artifact. Nothing from the recording is committed. See engine/bench/README.md.
on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: Direct link to a recording (MIT 14.01 Fall 2018, lecture 1, from the Internet Archive; CC BY-NC-SA)
        default: https://archive.org/download/MIT14.01F18/MIT14_01F18_lec01_300k.mp4
      model:
        description: Whisper model
        default: Xenova/whisper-base

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the recording
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          echo "::notice::recording: $AUDIO_URL"
          curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "$AUDIO_URL" -o lecture.src
          ls -l lecture.src
      - name: Convert to 16 kHz mono
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -loglevel error -i lecture.src -ac 1 -ar 16000 -c:a pcm_s16le lecture.wav
          ls -l lecture.wav
      - name: Transcribe and run the engine
        run: |
          npm install --no-save --no-package-lock @huggingface/transformers@3.0.2
          node test/real-audio.mjs lecture.wav out "${{ inputs.model }}" | tee out.log
          while IFS= read -r line; do echo "::notice::${line//$'\n'/ }"; done < <(grep -E '^(audio|transcribed|DATE|DEF)' out.log | head -60)
      - name: Show the transcript in the run summary
        run: |
          node -e '
            const fs = require("fs");
            const esc = (t) => t.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
            for (const [file, label] of [["out/transcript.txt", "transcript"], ["out/engine.json", "engine"]]) {
              const text = fs.readFileSync(file, "utf8");
              for (let i = 0, n = 1; i < text.length; i += 12000, n++) {
                console.log("::notice title=" + label + " " + n + "::" + esc(text.slice(i, i + 12000)));
              }
            }
          '
      - uses: actions/upload-artifact@v4
        with:
          name: real-audio-result
          path: out/
