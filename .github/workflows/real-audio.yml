name: Real audio

# Manual only. Takes real, openly licensed lecture recordings (by default MIT 14.01 lecture 1),
# runs each through Whisper and the engine exactly as the app does, and saves the transcript and
# what the engine found as a build artifact (and, compressed, in the run's annotations).
# Nothing from a recording is committed. Put the word "search" in `urls` to list recordings on the
# Internet Archive instead. See engine/bench/README.md.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Direct links to recordings, separated by spaces (Internet Archive copies of MIT OpenCourseWare lectures, CC BY-NC-SA)
        default: https://archive.org/download/MIT14.01F18/MIT14_01F18_lec01_300k.mp4
      model:
        description: Whisper model
        default: Xenova/whisper-base

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      search: ${{ steps.m.outputs.search }}
    steps:
      - id: m
        env:
          URLS: ${{ inputs.urls }}
        run: |
          if [ "$URLS" = "search" ] || [ "${URLS#list:}" != "$URLS" ]; then echo "search=yes" >> "$GITHUB_OUTPUT"; echo 'matrix=[]' >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "search=no" >> "$GITHUB_OUTPUT"
          echo "matrix=$(printf '%s\n' $URLS | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  search:
    needs: plan
    if: needs.plan.outputs.search == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: List MIT OpenCourseWare items on the Internet Archive
        env:
          URLS: ${{ inputs.urls }}
        run: |
          if [ "${URLS#list:}" != "$URLS" ]; then
            for id in ${URLS#list:}; do
              curl -sSL "https://archive.org/metadata/$id" -o ia.json
              ID=$id node -e '
                const f = (JSON.parse(require("fs").readFileSync("ia.json", "utf8")).files || []).filter((x) => /\.(mp4|mp3|m4a)$/i.test(x.name) && !/\.ia\./.test(x.name));
                const t = process.env.ID + ": " + f.map((x) => x.name + " " + Math.round(x.size / 1e6) + "MB").slice(0, 30).join(" | ");
                for (let i = 0; i < t.length; i += 3500) console.log("::notice::" + t.slice(i, i + 3500));
              '
            done
            exit 0
          fi
          for q in 'creator:"MIT OpenCourseWare" AND mediatype:movies' 'title:(MIT) AND (lecture OR "Fall 2018" OR "Spring 2018" OR "Fall 2017") AND mediatype:movies' 'identifier:MIT*F1*'; do
            curl -sSL -G 'https://archive.org/advancedsearch.php' --data-urlencode "q=$q" --data-urlencode 'fl[]=identifier' --data-urlencode 'fl[]=title' --data-urlencode 'rows=60' --data-urlencode 'output=json' -o ia.json
            node -e '
              const d = JSON.parse(require("fs").readFileSync("ia.json", "utf8")).response;
              const t = d.docs.map((x) => x.identifier + " = " + x.title).join(" | ");
              for (let i = 0; i < t.length; i += 3500) console.log("::notice::" + t.slice(i, i + 3500));
            '
          done

  transcribe:
    needs: plan
    if: needs.plan.outputs.search == 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the recording
        env:
          AUDIO_URL: ${{ matrix.url }}
        run: |
          echo "::notice::recording: $AUDIO_URL"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 30 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "$AUDIO_URL" -o lecture.src
          ls -l lecture.src
      - name: Convert to 16 kHz mono
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -loglevel error -i lecture.src -ac 1 -ar 16000 -c:a pcm_s16le lecture.wav
          ls -l lecture.wav
      - name: Transcribe and run the engine
        run: |
          npm install --no-save --no-package-lock @huggingface/transformers@3.0.2
          node test/real-audio.mjs lecture.wav out "${{ inputs.model }}" | tee out.log
      - name: Show the transcript (compressed) in the run annotations, part 1
        env:
          AUDIO_URL: ${{ matrix.url }}
        run: |
          [ -f transcript.b64 ] || gzip -9 -c out/transcript.txt | base64 -w0 > transcript.b64
          PART=0 node -e '
            const t = require("fs").readFileSync("transcript.b64", "utf8");
            const tag = process.env.AUDIO_URL.split("/").pop();
            const first = Number(process.env.PART) * 9;
            for (let n = first; n < first + 9 && n * 3500 < t.length; n++) console.log("::notice title=" + tag + " " + (n + 1) + "::" + t.slice(n * 3500, (n + 1) * 3500));
          '
      - name: Show the transcript (compressed) in the run annotations, part 2
        env:
          AUDIO_URL: ${{ matrix.url }}
        run: |
          [ -f transcript.b64 ] || gzip -9 -c out/transcript.txt | base64 -w0 > transcript.b64
          PART=1 node -e '
            const t = require("fs").readFileSync("transcript.b64", "utf8");
            const tag = process.env.AUDIO_URL.split("/").pop();
            const first = Number(process.env.PART) * 9;
            for (let n = first; n < first + 9 && n * 3500 < t.length; n++) console.log("::notice title=" + tag + " " + (n + 1) + "::" + t.slice(n * 3500, (n + 1) * 3500));
          '
      - name: Show the transcript (compressed) in the run annotations, part 3
        env:
          AUDIO_URL: ${{ matrix.url }}
        run: |
          [ -f transcript.b64 ] || gzip -9 -c out/transcript.txt | base64 -w0 > transcript.b64
          PART=2 node -e '
            const t = require("fs").readFileSync("transcript.b64", "utf8");
            const tag = process.env.AUDIO_URL.split("/").pop();
            const first = Number(process.env.PART) * 9;
            for (let n = first; n < first + 9 && n * 3500 < t.length; n++) console.log("::notice title=" + tag + " " + (n + 1) + "::" + t.slice(n * 3500, (n + 1) * 3500));
          '
      - uses: actions/upload-artifact@v4
        with:
          name: real-audio-${{ strategy.job-index }}
          path: out/
