name: Real audio

# Manual only. Takes a real, openly licensed lecture recording, runs it through Whisper and the
# engine exactly as the app does, and saves the transcript and what the engine found as a build
# artifact. Nothing from the recording is committed. See engine/bench/README.md.
on:
  workflow_dispatch:
    inputs:
      page:
        description: OCW lecture page to find the recording on
        default: https://ocw.mit.edu/courses/14-01-principles-of-microeconomics-fall-2018/resources/lec1-intro/
      audio_url:
        description: Direct link to the recording (leave empty to find it on the page above)
        default: ""
      model:
        description: Whisper model
        default: Xenova/whisper-base

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find and download the recording
        env:
          PAGE: ${{ inputs.page }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          url="$AUDIO_URL"
          if [ -z "$url" ]; then
            code=$(curl -sSL -A "$UA" -w '%{http_code}' "$PAGE" -o page.html || true)
            echo "::notice::page $PAGE -> HTTP $code, $(wc -c < page.html) bytes"
            if [ "$code" = 200 ]; then
              url=$(grep -oE 'https://[^"\\ ]+\.(mp3|mp4|m4a)' page.html | head -1 || true)
            else
              echo "::notice::page body: $(head -c 300 page.html | tr '\n' ' ')"
            fi
          fi
          if [ -z "$url" ]; then
            # OCW lecture videos are mirrored on the Internet Archive
            for q in 'title:("Principles of Microeconomics") AND (MIT OR "OpenCourseWare")' 'MIT 14.01 Gruber Supply Demand lecture 1' 'title:("Introduction and Supply") AND Demand'; do
              curl -sSL -A "$UA" -G 'https://archive.org/advancedsearch.php' --data-urlencode "q=$q" --data-urlencode 'fl[]=identifier' --data-urlencode 'fl[]=title' --data-urlencode 'rows=15' --data-urlencode 'output=json' -o ia.json || true
              echo "::notice::archive.org [$q]: $(grep -oE '"(identifier|title)":"[^"]*"' ia.json | head -30 | tr '\n' ' ')"
            done
            echo "::error::no recording link found; pass audio_url"
            exit 1
          fi
          echo "::notice::recording: $url"
          curl -fsSL -A "$UA" "$url" -o lecture.src
          ls -l lecture.src
      - name: Convert to 16 kHz mono
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -loglevel error -i lecture.src -ac 1 -ar 16000 -c:a pcm_s16le lecture.wav
          ls -l lecture.wav
      - name: Transcribe and run the engine
        run: |
          npm install --no-save --no-package-lock @huggingface/transformers@3.0.2
          node test/real-audio.mjs lecture.wav out "${{ inputs.model }}" | tee out.log
          while IFS= read -r line; do echo "::notice::${line//$'\n'/ }"; done < <(grep -E '^(audio|transcribed|DATE|DEF)' out.log | head -60)
      - uses: actions/upload-artifact@v4
        with:
          name: real-audio-result
          path: out/
